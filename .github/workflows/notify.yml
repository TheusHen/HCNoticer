name: HCNoticer

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm start
        env:
          MAILERSEND_API_KEY: ${{ secrets.MAILERSEND_API_KEY }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_FROM_EMAIL: ${{ secrets.EMAIL_FROM_EMAIL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit state
        env:
          CO_AUTHOR_NAME: ${{ vars.CO_AUTHOR_NAME }}
          CO_AUTHOR_EMAIL: ${{ vars.CO_AUTHOR_EMAIL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          # Defaults to you as Co-authored-by. Override via repo
          # Variables CO_AUTHOR_NAME / CO_AUTHOR_EMAIL if needed.
          CO_AUTHOR_NAME="${CO_AUTHOR_NAME:-$GITHUB_REPOSITORY_OWNER}"
          CO_AUTHOR_EMAIL="${CO_AUTHOR_EMAIL:-mmmatheushenriqueee@gmail.com}"
          git diff --cached --quiet || git commit -m "chore: update state" -m "Co-authored-by: $CO_AUTHOR_NAME <$CO_AUTHOR_EMAIL>"
          git push
